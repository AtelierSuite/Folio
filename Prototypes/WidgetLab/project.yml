name: WidgetLab
options:
  bundleIdPrefix: com.tsubuzaki
  deploymentTarget:
    iOS: "26.1"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    GENERATE_INFOPLIST_FILE: YES
targets:
  WidgetLab:
    type: application
    platform: iOS
    sources: [WidgetLab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsubuzaki.WidgetLab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  WidgetLabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WidgetLabTests]
    dependencies:
      - target: WidgetLab
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WidgetLab.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WidgetLab
        BUNDLE_LOADER: $(TEST_HOST)
  WidgetLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WidgetLabUITests]
    dependencies:
      - target: WidgetLab
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  WidgetLab:
    build:
      targets:
        WidgetLab: all
    test:
      targets: [WidgetLabTests, WidgetLabUITests]
